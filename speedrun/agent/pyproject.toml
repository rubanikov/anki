# The agent service has its own environment on purpose.
#
# LangGraph's dependency tree does not belong inside Anki's bundled Python: the
# desktop app must start, score Memory and show coverage whether or not this
# service exists, and the surest way to guarantee that is for the two never to
# share an interpreter. Nothing in `speedrun/addon/` imports anything from here.
#
#   uv sync            # build the environment
#   uv run speedrun-agent
#   uv run pytest

[project]
name = "speedrun-agent"
version = "0.1.0"
description = "Grounded item generation behind a span-level gate."
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "langgraph>=0.2.50",
    "pydantic>=2.9",
    # Starlette's TestClient needs it, and `speedrun-agent --attempt` drives the
    # real HTTP boundary rather than reaching past it.
    "httpx>=0.27",
]

[project.optional-dependencies]
# Only reached when ANTHROPIC_API_KEY is set. Absent key, absent import.
anthropic = ["anthropic>=0.40"]
# LangSmith is opt-in the same way: no key, no client, local traces instead.
langsmith = ["langsmith>=0.1.140"]

[project.scripts]
speedrun-agent = "speedrun_agent.__main__:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["speedrun_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
